# ==============================================================================
# HYPRLOCK CONFIGURATION FOR MANGO COMPOSITOR
# ==============================================================================

# Dynamic Matugen Theme Colors (Fallback included)
source = ~/.config/hypr/hyprlock-colors.conf

$font = Maple Mono NF

general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 0
    no_fade_in = false
}

background {
    monitor =
    path = ~/.config/mango/wallpaper/current.jpg
    color = rgba(11, 15, 10, 1.0)
    blur_passes = 3
    blur_size = 6
    noise = 0.015
    contrast = 0.89
    brightness = 0.75
    vibrancy = 0.2
    vibrancy_darkness = 0.0
}

# ------------------------------------------------------------------------------
# Status (Top Bar / Battery)
# ------------------------------------------------------------------------------
label {
    monitor =
    text = cmd[update:5000] echo "$([ -f /sys/class/power_supply/BAT1/capacity ] && echo "$(cat /sys/class/power_supply/BAT1/capacity)% $([ "$(cat /sys/class/power_supply/BAT1/status 2>/dev/null)" = "Charging" ] && echo "󱐋" || echo "󰁹")" || echo "")"
    color = $text_muted
    font_size = 14
    font_family = $font
    position = -30, -30
    halign = right
    valign = top
}

# ------------------------------------------------------------------------------
# Clock & Date
# ------------------------------------------------------------------------------
# Time (Hours & Minutes)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = $primary
    font_size = 90
    font_family = $font Bold
    position = 0, 160
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.4)
}

# Date
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %d %B %Y")"
    color = $text
    font_size = 18
    font_family = $font
    position = 0, 80
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(0, 0, 0, 0.3)
}

# ------------------------------------------------------------------------------
# User Greeting
# ------------------------------------------------------------------------------
label {
    monitor =
    text =   $USER
    color = $text_muted
    font_size = 16
    font_family = $font
    position = 0, -80
    halign = center
    valign = center
}

# ------------------------------------------------------------------------------
# Password Input Field
# ------------------------------------------------------------------------------
input-field {
    monitor =
    size = 280, 52
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    dots_rounding = -1
    outer_color = $outline
    inner_color = $surface
    font_color = $text
    fade_on_empty = false
    font_family = $font
    placeholder_text = <i>Input Password...</i>
    hide_input = false
    rounding = 26
    check_color = $primary
    fail_color = $error
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_transition = 300
    capslock_color = $urgent
    numlock_color = -1
    bothlock_color = -1
    invert_numlock = false
    swap_font_color = false
    position = 0, -140
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.3)
}
