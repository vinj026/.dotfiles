# ==============================================================================
# ALACRITTY CONFIGURATION (Material 3 Aesthetic)
# ==============================================================================

[general]
import = ["~/.config/alacritty/theme.toml"]

[font]
size = 11.0

[font.normal]
family = "Iosevka Nerd Font"

[window]
padding = { x = 12, y = 12 }
opacity = 0.83
blur = true
decorations = "None"

[cursor]
style = { shape = "Beam", blinking = "On" }

[terminal.shell]
program = "/usr/bin/fish"
