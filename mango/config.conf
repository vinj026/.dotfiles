# ==============================================================================
# MANGO COMPOSITOR CONFIGURATION (MODULAR)
# Documentation: https://github.com/DreamMaoMao/mango/wiki/
# ==============================================================================

# This is the main configuration file that sources all modular components
# Each section is split into separate files in modules/ for clean organization

# ------------------------------------------------------------------------------
# Load Modular Configuration Files
# ------------------------------------------------------------------------------

# Environment Variables (XCURSOR, Wayland, Qt platform themes)
source-optional=~/.config/mango/modules/environment.conf

# Monitor Setup
source-optional=~/.config/mango/modules/monitors.conf

# Visual Theme & Effects (Borders, Gaps, Blur, Shadows)
source-optional=~/.config/mango/modules/visuals.conf

# Animations
source-optional=~/.config/mango/modules/animations.conf

# Layouts (Scroller, Tile, Dwindle, Per-tag rules)
source-optional=~/.config/mango/modules/layouts.conf

# Window Rules & Behavior
source-optional=~/.config/mango/modules/windows.conf

# Input Devices (Keyboard, Mouse, Touchpad)
source-optional=~/.config/mango/modules/input.conf

# Keybindings
source-optional=~/.config/mango/modules/keybindings.conf

# Dynamic Theme Colors (Generated by Matugen)
source-optional=~/.config/mango/theme.conf

# ------------------------------------------------------------------------------
# Autostart Applications (awww, quickshell, cliphist, xdg-desktop-portal)
# ------------------------------------------------------------------------------
exec-once=bash ~/.config/mango/autostart.sh
