# bind=SUPER+SHIFT,W,spawn,~/.config/scripts/wallpaper-picker.sh

# ------------------------------------------------------------------------------
# Gaming Mode Shortcuts
# ------------------------------------------------------------------------------

# Example: Disable compositor effects for gaming
# bind=SUPER+SHIFT,G,spawn,mango-msg keyword animations 0
# bind=SUPER+SHIFT+CTRL,G,spawn,mango-msg keyword animations 1

# ------------------------------------------------------------------------------
# Workspace-Specific Shortcuts
# ------------------------------------------------------------------------------

# Quick window cycling di dalam workspace saat ini (Alt-Tab behavior)
bind=ALT,Tab,focusstack,next
bind=ALT+SHIFT,Tab,focusstack,prev

