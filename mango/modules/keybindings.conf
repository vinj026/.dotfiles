# Custom User Shortcuts (Add your own here)
# ------------------------------------------------------------------------------

# Example: Launch specific applications
# bind=SUPER,1,spawn,firefox
# bind=SUPER,2,spawn,code
# bind=SUPER,3,spawn,discord

# Example: Custom scripts
