# ==============================================================================
# KEYBINDINGS CONFIGURATION
# ==============================================================================
# This file contains all keyboard shortcuts and bindings for MangoWM

# ------------------------------------------------------------------------------
# Compositor Lifecycle
# ------------------------------------------------------------------------------
bind=SUPER+SHIFT,R,reload_config
bind=SUPER+SHIFT,E,quit

# ------------------------------------------------------------------------------
# Core Applications
# ------------------------------------------------------------------------------
bind=SUPER,Return,spawn,kitty
bind=SUPER,space,spawn,quickshell ipc call launcher toggle
bind=SUPER,d,spawn,quickshell ipc call launcher toggle
bind=SUPER+CTRL,t,spawn,quickshell ipc call config cycleTheme
bind=SUPER+CTRL,b,spawn,quickshell ipc call config cycleStyle
bind=SUPER,W,spawn,quickshell ipc call wallpaperSwitcher toggle

# ------------------------------------------------------------------------------
# Window Actions
# ------------------------------------------------------------------------------
bind=SUPER,Q,killclient
bind=ALT,Q,killclient
bind=SUPER,F,togglefullscreen
bind=SUPER,V,togglefloating
bind=SUPER,M,togglemaximizescreen
bind=SUPER,S,toggle_scratchpad
bind=SUPER,backslash,switch_layout

# ------------------------------------------------------------------------------
# Window Focus (Arrow Keys & Vim Keys)
# ------------------------------------------------------------------------------
bind=SUPER,Tab,focusstack,next
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down
bind=SUPER,h,focusdir,left
bind=SUPER,l,focusdir,right
bind=SUPER,k,focusdir,up
bind=SUPER,j,focusdir,down

# ------------------------------------------------------------------------------
# Window Swap / Exchange
# ------------------------------------------------------------------------------
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,l,exchange_client,right
bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,j,exchange_client,down

# ------------------------------------------------------------------------------
# Window Resizing
# ------------------------------------------------------------------------------
bind=SUPER+CTRL,Left,resizewin,-30,+0
bind=SUPER+CTRL,Right,resizewin,+30,+0
bind=SUPER+CTRL,Up,resizewin,+0,-30
bind=SUPER+CTRL,Down,resizewin,+0,+30
bind=SUPER+CTRL,h,resizewin,-30,+0
bind=SUPER+CTRL,l,resizewin,+30,+0
bind=SUPER+CTRL,k,resizewin,+0,-30
bind=SUPER+CTRL,j,resizewin,+0,+30

# ------------------------------------------------------------------------------
# Tag / Workspace Navigation (1 - 10)
# ------------------------------------------------------------------------------
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0
bind=SUPER,0,view,10,0

# ------------------------------------------------------------------------------
# Move Window to Tag (1 - 10)
# ------------------------------------------------------------------------------
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0
bind=SUPER+SHIFT,0,tag,10,0

# ------------------------------------------------------------------------------
# Move Window Silently to Tag (1 - 10)
# ------------------------------------------------------------------------------
bind=SUPER+CTRL,1,tagsilent,1
bind=SUPER+CTRL,2,tagsilent,2
bind=SUPER+CTRL,3,tagsilent,3
bind=SUPER+CTRL,4,tagsilent,4
bind=SUPER+CTRL,5,tagsilent,5
bind=SUPER+CTRL,6,tagsilent,6
bind=SUPER+CTRL,7,tagsilent,7
bind=SUPER+CTRL,8,tagsilent,8
bind=SUPER+CTRL,9,tagsilent,9
bind=SUPER+CTRL,0,tagsilent,10

# ------------------------------------------------------------------------------
# Monitor Focus & Move
# ------------------------------------------------------------------------------
bind=SUPER+ALT,Left,focusmon,left
bind=SUPER+ALT,Right,focusmon,right
bind=SUPER+ALT+SHIFT,Left,tagmon,left
bind=SUPER+ALT+SHIFT,Right,tagmon,right

# ------------------------------------------------------------------------------
# Scroller Layout Controls
# ------------------------------------------------------------------------------
bind=SUPER,bracketleft,set_proportion,0.5
bind=SUPER,bracketright,set_proportion,1.0
bind=SUPER,equal,switch_proportion_preset

# Extra keybind biar lebih enak dijangkau jari (, dan .)
bind=SUPER,comma,set_proportion,0.5
bind=SUPER,period,set_proportion,1.0
bind=SUPER,slash,switch_proportion_preset

# ------------------------------------------------------------------------------
# Multimedia & Hardware Keys
# ------------------------------------------------------------------------------
# Volume Control (wpctl)
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Brightness Control (brightnessctl)
bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl set +5%
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl set 5%-

# ------------------------------------------------------------------------------
# Screenshot Controls
# ------------------------------------------------------------------------------
# Area screenshot to clipboard
bind=NONE,Print,spawn,bash -c "grim -g \"$(slurp)\" - | wl-copy"
bind=SUPER+SHIFT,S,spawn,bash -c "grim -g \"$(slurp)\" - | wl-copy"

# Fullscreen screenshot to file
bind=SUPER,Print,spawn,bash -c "grim ~/Pictures/Screenshots/Screenshot_$(date +'%Y-%m-%d_%H-%M-%S').png"

# ------------------------------------------------------------------------------
# Mouse Bindings
# ------------------------------------------------------------------------------
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
mousebind=NONE,btn_middle,togglemaximizescreen,0

# ------------------------------------------------------------------------------
# Axis Bindings (Scroll Wheel)
# ------------------------------------------------------------------------------
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

