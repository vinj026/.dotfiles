# ==============================================================================
# ANIMATIONS CONFIGURATION
# ==============================================================================
# This file contains all animation settings for smooth transitions and effects

# ------------------------------------------------------------------------------
# Animation Control
# ------------------------------------------------------------------------------
animations=1
layer_animations=1

# ------------------------------------------------------------------------------
# Animation Types
# ------------------------------------------------------------------------------
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1

# ------------------------------------------------------------------------------
# Zoom Animation Settings
# ------------------------------------------------------------------------------
zoom_initial_ratio=0.5
zoom_end_ratio=0.85

# ------------------------------------------------------------------------------
# Fade Animation Settings
# ------------------------------------------------------------------------------
fadein_begin_opacity=0.4
fadeout_begin_opacity=0.8

# ------------------------------------------------------------------------------
# Animation Durations (in milliseconds)
# ------------------------------------------------------------------------------
animation_duration_move=400
animation_duration_open=350
animation_duration_tag=300
animation_duration_close=350
animation_duration_focus=150

# ------------------------------------------------------------------------------
# Animation Curves (Bezier Curves for Easing)
# ------------------------------------------------------------------------------
# Format: x1,y1,x2,y2 (cubic-bezier values)

# Smooth slide & zoom curves
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opafadein=0.46,1.0,0.29,1
animation_curve_opafadeout=0.5,0.5,0.5,0.5

# ------------------------------------------------------------------------------
# Animation Presets (Uncomment to use alternative styles)
# ------------------------------------------------------------------------------

# Fast & Snappy Animations
# animation_duration_move=200
# animation_duration_open=150
# animation_duration_tag=200
# animation_duration_close=150
# animation_duration_focus=100

# Slow & Smooth Animations  
# animation_duration_move=600
# animation_duration_open=500
# animation_duration_tag=450
# animation_duration_close=500
# animation_duration_focus=200

# Bounce Effect Curves
# animation_curve_open=0.68,-0.55,0.265,1.55
# animation_curve_close=0.68,-0.55,0.265,1.55

# Sharp & Quick Curves
# animation_curve_open=0.25,0.46,0.45,0.94
# animation_curve_close=0.55,0.06,0.68,0.19

# ------------------------------------------------------------------------------
# Performance Options
# ------------------------------------------------------------------------------

# Disable animations for better performance
# animations=0
# layer_animations=0

# Reduce animation complexity
# animation_fade_in=0
# animation_fade_out=0

# ------------------------------------------------------------------------------
# Advanced Animation Settings
# ------------------------------------------------------------------------------

# Custom animation for specific actions
# animation_type_workspace=slide
# animation_type_minimize=zoom

# Direction control for workspace animations
# workspace_animation_direction=horizontal

# Animation exclusions (disable for specific windows)
# animation_exclude=class_g = "Firefox" && window_type = "popup_menu"