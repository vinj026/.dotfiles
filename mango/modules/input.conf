# ==============================================================================
# INPUT DEVICES CONFIGURATION
# ==============================================================================
# This file contains all input device settings for keyboard, mouse, and touchpad

# ------------------------------------------------------------------------------
# Keyboard Settings
# ------------------------------------------------------------------------------
# Key repeat settings
repeat_rate=30
repeat_delay=400

# Keyboard layout and options
xkb_rules_layout=us
numlockon=1

# Additional keyboard layouts (uncomment to use)
# xkb_rules_layout=us,ru
# xkb_rules_variant=,
# xkb_rules_options=grp:alt_shift_toggle

# ------------------------------------------------------------------------------
# Touchpad Settings
# ------------------------------------------------------------------------------
# Basic touchpad functionality
tap_to_click=1
tap_and_drag=1
drag_lock=1

# Scrolling behavior
trackpad_natural_scrolling=1
trackpad_disable_while_typing=1

# Advanced touchpad settings (uncomment to customize)
# scroll_method=two_finger
# click_method=button_areas
# middle_emulation=1

# ------------------------------------------------------------------------------
# Mouse Settings
# ------------------------------------------------------------------------------
# Mouse scrolling (opposite of touchpad for most users)
mouse_natural_scrolling=0

# Mouse acceleration (uncomment to customize)
# accel_profile=flat
# pointer_accel=0.0

# Mouse button mapping (uncomment to customize)
# left_handed=0
# scroll_button=0

# ------------------------------------------------------------------------------
# Advanced Input Settings
# ------------------------------------------------------------------------------

# Sensitivity settings
# sensitivity=1.0
# scroll_sensitivity=1.0

# Input device specific rules (uncomment and modify as needed)
# device_rule=name:Synaptics TouchPad,tap_to_click:1,natural_scroll:1
# device_rule=name:Logitech Mouse,accel_profile:flat,pointer_accel:-0.5

# ------------------------------------------------------------------------------
# Gaming Input Settings
# ------------------------------------------------------------------------------

# Raw input for gaming (disable acceleration)
# accel_profile=flat
# pointer_accel=0.0

# Gaming mouse settings
# force_no_accel=1

# ------------------------------------------------------------------------------
# Accessibility Settings
# ------------------------------------------------------------------------------

# Sticky keys
# sticky_keys=0

# Slow keys
# slow_keys=0

# Bounce keys (ignore rapid keypresses)
# bounce_keys=0

# ------------------------------------------------------------------------------
# Custom Input Device Rules
# ------------------------------------------------------------------------------

# Example: Wacom tablet configuration
# device_rule=name:Wacom,tool_mode:pen,area:0x0+1920+1080

# Example: Gaming controller
# device_rule=name:Xbox Controller,deadzone:0.1

# Example: External keyboard
# device_rule=name:Logitech Keyboard,repeat_rate:50,repeat_delay:300

# ------------------------------------------------------------------------------
# Input Method (IME) Support
# ------------------------------------------------------------------------------

# For multilingual input support
# env=GTK_IM_MODULE,fcitx
# env=QT_IM_MODULE,fcitx
# env=XMODIFIERS,@im=fcitx