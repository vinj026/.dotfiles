# ==============================================================================
# WINDOW RULES & BEHAVIOR CONFIGURATION
# ==============================================================================
# This file contains window behavior settings, rules, and layer configurations

# ------------------------------------------------------------------------------
# Window Focus & Cursor Behavior
# ------------------------------------------------------------------------------
sloppyfocus=1
warpcursor=1
focus_on_activate=1
focus_cross_monitor=1
exchange_cross_monitor=1
view_current_to_back=1

# ------------------------------------------------------------------------------
# Window Dragging & Tiling Behavior
# ------------------------------------------------------------------------------
drag_tile_to_tile=1
drag_tile_small=1
drag_warp_cursor=1
enable_floating_snap=1
snap_distance=20

# ------------------------------------------------------------------------------
# System & Performance Settings
# ------------------------------------------------------------------------------
syncobj_enable=1
xwayland_persistence=1

# ------------------------------------------------------------------------------
# Scratchpad Configuration
# ------------------------------------------------------------------------------
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.85

# ------------------------------------------------------------------------------
# Layer Rules
# ------------------------------------------------------------------------------
# Screenshot layer (clean capture without blur/animation artifacts)
layerrule=noanim:1,noblur:1,layer_name:selection

# Additional layer rules (uncomment as needed)
# layerrule=blur:0,layer_name:notifications
# layerrule=ignorealpha:0.5,layer_name:bar

# ------------------------------------------------------------------------------
# Application-Specific Window Rules
# ------------------------------------------------------------------------------

# Audio & Volume Control
windowrule=isfloating:1,appid:.*pavucontrol.*
windowrule=isfloating:1,title:Volume Control

# Bluetooth Management
windowrule=isfloating:1,appid:.*blueman.*

# Network Management
windowrule=isfloating:1,appid:.*nm-connection-editor.*

# Authentication & Polkit
windowrule=isfloating:1,appid:.*polkit.*
windowrule=isfloating:1,appid:xdg-desktop-portal-gtk

# File Dialogs
windowrule=isfloating:1,title:Open File.*
windowrule=isfloating:1,title:Save File.*

# System Dialogs
windowrule=isfloating:1,title:Confirm.*
windowrule=isfloating:1,title:Preferences

# ------------------------------------------------------------------------------
# Application-Specific Behavior (Uncomment to use)
# ------------------------------------------------------------------------------

# Web Browsers
# windowrule=workspace:2,appid:firefox
# windowrule=workspace:2,appid:chromium

# Code Editors
# windowrule=workspace:3,appid:code
# windowrule=workspace:3,appid:nvim

# Media Players
# windowrule=workspace:5,appid:mpv
# windowrule=isfloating:1,appid:mpv
# windowrule=size:800x600,appid:mpv

# Gaming
# windowrule=workspace:6,appid:steam
# windowrule=fullscreen:1,appid:.*game.*

# Communication
# windowrule=workspace:9,appid:discord
# windowrule=workspace:9,appid:telegram

# File Managers
# windowrule=isfloating:1,appid:thunar
# windowrule=size:1000x700,appid:thunar

# Obsidian (Notes & Popouts Floating & Centered)
windowrule=isfloating:1,width:0.82,height:0.86,appid:md.obsidian.Obsidian

# ------------------------------------------------------------------------------
# Window Size & Position Rules
# ------------------------------------------------------------------------------

# Default floating window behavior:
# - In MangoWM, all floating windows are automatically centered unless no_force_center:1 is specified.
# - Edge and window snapping is enabled above (enable_floating_snap=1, snap_distance=20).
# - Geometry width/height below 1.0 represents percentage of screen; > 1 represents pixels.

# ------------------------------------------------------------------------------
# Window Opacity Rules
# ------------------------------------------------------------------------------

# Terminal transparency
# windowrule=opacity:0.9,appid:kitty
# windowrule=opacity:0.95,appid:alacritty

# Background applications
# windowrule=opacity:0.8,appid:code

# ------------------------------------------------------------------------------
# Advanced Window Rules
# ------------------------------------------------------------------------------

# Disable borders for specific applications
# windowrule=noborder:1,appid:mpv
# windowrule=noborder:1,fullscreen:1

# No shadows for specific windows
# windowrule=noshadow:1,appid:.*menu.*

# Disable animations for specific applications
# windowrule=noanim:1,appid:steam

# Pin windows (always on top)
# windowrule=pin:1,title:.*Picture-in-Picture.*

# ------------------------------------------------------------------------------
# Window Class & Instance Rules
# ------------------------------------------------------------------------------

# X11 applications (using class instead of appid)
# windowrule=isfloating:1,class:Xdg-desktop-portal-gtk
# windowrule=workspace:4,class:jetbrains-idea

# ------------------------------------------------------------------------------
# Conditional Rules
# ------------------------------------------------------------------------------

# Float windows smaller than certain size
# windowrule=isfloating:1,minsize:1x1,maxsize:400x300

# Tile windows larger than certain size
# windowrule=tile:1,minsize:800x600

# ------------------------------------------------------------------------------
# Emergency Rules (for problematic applications)
# ------------------------------------------------------------------------------

# Force specific applications to behave properly
# windowrule=forceinput:1,appid:problematic-app
# windowrule=windowdance:0,appid:broken-app