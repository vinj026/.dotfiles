# ==============================================================================
# LAYOUT CONFIGURATION
# ==============================================================================
# This file contains all layout settings for different window management modes

# ------------------------------------------------------------------------------
# General Layout Settings
# ------------------------------------------------------------------------------
tag_num=10

# ------------------------------------------------------------------------------
# Master-Stack Layout Configuration
# ------------------------------------------------------------------------------
# Controls the traditional master-stack tiling layout

# New windows become master by default
new_is_master=1

# Master area factor (0.1 to 0.9)
# 0.55 = master takes 55% of screen width
default_mfact=0.55

# Number of windows in master area
default_nmaster=1

# ------------------------------------------------------------------------------
# Scroller Layout Configuration
# ------------------------------------------------------------------------------
# Controls the horizontal scrolling layout mode

# Maximum number of window structures in scroller
scroller_structs=20

# Default proportion for scroller windows
# 1.0 = window fills the viewport
scroller_default_proportion=1.0

# Focus behavior
scroller_focus_center=0
scroller_prefer_center=0
scroller_prefer_overspread=1

# Edge scroller settings
edge_scroller_pointer_focus=1
edge_scroller_focus_allow_speed=0.0

# Single window proportion in scroller mode
scroller_default_proportion_single=1.0

# Proportion presets for quick switching
scroller_proportion_preset=0.5,0.8,1.0

# ------------------------------------------------------------------------------
# Dwindle Layout Configuration
# ------------------------------------------------------------------------------
# Controls the binary space partitioning layout

# Smart splitting (auto-choose split direction)
dwindle_smart_split=0

# Drop simple split (merge small splits)
dwindle_drop_simple_split=1

# Manual split control
dwindle_manual_split=0

# Split directions
dwindle_hsplit=1
dwindle_vsplit=1

# Preserve split ratios when windows close
dwindle_preserve_split=0

# ------------------------------------------------------------------------------
# Tag Layout Rules
# ------------------------------------------------------------------------------
# Set default layout for each workspace/tag
# Available layouts: tile, scroller, dwindle, floating

# Default fallback layout untuk semua workspace
tagrule=id:*,layout_name:tile

# Per-tag layout examples (uncomment to use)
# tagrule=id:1,layout_name:tile
# tagrule=id:2,layout_name:scroller
# tagrule=id:3,layout_name:dwindle
# tagrule=id:9,layout_name:floating

# ------------------------------------------------------------------------------
# Layout-Specific Workspace Rules
# ------------------------------------------------------------------------------

# Different gap settings per workspace
# tagrule=id:1,gappih:10,gappiv:10
# tagrule=id:2,gappih:0,gappiv:0

# ------------------------------------------------------------------------------
# Advanced Layout Options
# ------------------------------------------------------------------------------

# Automatically switch layout based on window count
# auto_layout_switch=1
# auto_layout_threshold=3
# auto_layout_fallback=scroller

# Layout cycling order
# layout_cycle_order=tile,scroller,dwindle,floating

# Preserve layout when switching workspaces
# preserve_layout_per_tag=1

# ------------------------------------------------------------------------------
# Layout Presets (Uncomment sections to use)
# ------------------------------------------------------------------------------

# Gaming Setup (fewer distractions)
# default_mfact=0.7
# default_nmaster=1
# scroller_default_proportion=1.0

# Coding Setup (more windows visible)
# default_mfact=0.5
# default_nmaster=2
# scroller_default_proportion=0.6

# Media Setup (single large window)
# default_mfact=0.8
# default_nmaster=1
# scroller_default_proportion=0.9