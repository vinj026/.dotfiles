# ==============================================================================
# VISUAL STYLING & EFFECTS
# ==============================================================================
# This file contains all visual styling, theming, and effects configurations

# ------------------------------------------------------------------------------
# Window Borders & Decoration
# ------------------------------------------------------------------------------
borderpx=1
border_radius=8
no_radius_when_single=0

# ------------------------------------------------------------------------------
# Gaps & Spacing
# ------------------------------------------------------------------------------
# Inner gaps (between windows)
gappih=6
gappiv=6

# Outer gaps (between windows and screen edge)
gappoh=10
gappov=10

# Smart gaps (remove gaps when only one window)
smartgaps=0

# ------------------------------------------------------------------------------
# Cursor Configuration
# ------------------------------------------------------------------------------
cursor_theme=GoogleDot-White
cursor_size=16

# ------------------------------------------------------------------------------
# Blur Effects
# ------------------------------------------------------------------------------
blur=1
blur_layer=1
blur_optimized=1
blur_params_num_passes=2
blur_params_radius=5
blur_params_noise=0.02
blur_params_brightness=0.9
blur_params_contrast=0.9
blur_params_saturation=1.2

# ------------------------------------------------------------------------------
# Shadow Effects
# ------------------------------------------------------------------------------
shadows=1
layer_shadows=1
shadow_only_floating=1
shadows_size=12
shadows_blur=16
shadows_position_x=0
shadows_position_y=2
shadowscolor=0x00000088

# ------------------------------------------------------------------------------
# Window Opacity
# ------------------------------------------------------------------------------
focused_opacity=1.0
unfocused_opacity=0.95

# ------------------------------------------------------------------------------
# Advanced Visual Options (Uncomment to enable)
# ------------------------------------------------------------------------------

# Dim inactive windows
# dim_inactive=1
# dim_inactive_alpha=0.8

# Round corners for specific windows only
# round_corners_only_floating=1

# Disable blur for fullscreen windows (performance)
# blur_ignore_opacity=1

# Custom blur exclusions (regex patterns)
# blur_exclude=class_g = "Firefox" && window_type = "utility"

# ------------------------------------------------------------------------------
# Performance Tuning
# ------------------------------------------------------------------------------

# Reduce effects for better performance on older hardware
# blur_params_num_passes=1
# blur_params_radius=3
# shadows=0
# animations=0

# Enable VSync (may help with tearing)
# vblank_mode=1