# ==============================================================================
# MONITOR CONFIGURATION
# ==============================================================================
# This file contains all monitor setup and display configurations

# ------------------------------------------------------------------------------
# Secondary Monitor (External Display - Left)
# ------------------------------------------------------------------------------
# HDMI-A-1: External monitor via HDMI (placed on the left)
# - Resolution: 1366x768
# - Refresh Rate: 59.79Hz  
# - Position: Left of primary display (0,0)
# - Scale: 1.0 (no scaling)
monitorrule=name:^HDMI-A-1$,width:1366,height:768,refresh:59.79,x:0,y:0,scale:1.0

# ------------------------------------------------------------------------------
# Primary Monitor (Internal Display - Right)
# ------------------------------------------------------------------------------
# eDP-1: Internal laptop display
# - Resolution: 1920x1080
# - Refresh Rate: 165.01Hz
# - Position: Right of HDMI-A-1 (1366,0)
# - Scale: 1.0 (no scaling)
monitorrule=name:^eDP-1$,width:1920,height:1080,refresh:165.01,x:1366,y:0,scale:1.0

# ------------------------------------------------------------------------------
# Additional Monitor Configurations (Uncomment and modify as needed)
# ------------------------------------------------------------------------------

# Example: 4K Monitor with scaling
# monitorrule=name:^DP-1$,width:3840,height:2160,refresh:60.00,x:0,y:0,scale:2.0

# Example: Vertical monitor setup
# monitorrule=name:^DP-2$,width:1080,height:1920,refresh:60.00,x:1920,y:0,scale:1.0

# Example: Triple monitor setup
# monitorrule=name:^DP-3$,width:1920,height:1080,refresh:144.00,x:3286,y:0,scale:1.0

# ------------------------------------------------------------------------------
# Monitor-specific Workspace Rules (Optional)
# ------------------------------------------------------------------------------
# Bind specific workspaces to specific monitors
# workspace=1,monitor:eDP-1
# workspace=2,monitor:eDP-1
# workspace=6,monitor:HDMI-A-1
# workspace=7,monitor:HDMI-A-1

# ------------------------------------------------------------------------------
# Configuration Notes
# ------------------------------------------------------------------------------
# To find your monitor names and specifications, use:
# - wlr-randr (if available)
# - kanshi list
# - Check /sys/class/drm/*/status for connected displays
#
# Common monitor connection names:
# - eDP-1, eDP-2: Internal laptop displays
# - HDMI-A-1, HDMI-A-2: HDMI connections
# - DP-1, DP-2: DisplayPort connections  
# - DVI-D-1: DVI connections
# - VGA-1: VGA connections