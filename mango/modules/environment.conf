# ==============================================================================
# ENVIRONMENT VARIABLES
# ==============================================================================
# This file contains all environment variable configurations for MangoWM
# These settings control various aspects of the Wayland session and applications

# ------------------------------------------------------------------------------
# Cursor Configuration
# ------------------------------------------------------------------------------
env=XCURSOR_THEME,GoogleDot-White
env=XCURSOR_SIZE,16

# ------------------------------------------------------------------------------
# Desktop Environment & Session Type
# ------------------------------------------------------------------------------
env=XDG_CURRENT_DESKTOP,mango:wlroots
env=XDG_SESSION_TYPE,wayland

# ------------------------------------------------------------------------------
# Qt Application Configuration
# ------------------------------------------------------------------------------
env=QT_QPA_PLATFORM,wayland;xcb
env=QT_QPA_PLATFORMTHEME,qt6ct
env=QT_WAYLAND_DISABLE_WINDOWDECORATION,1

# ------------------------------------------------------------------------------
# GTK Theme Configuration (Configured via gtk-3.0/settings.ini & gsettings)
# ------------------------------------------------------------------------------
env=GTK_THEME,adw-gtk3-dark

# ------------------------------------------------------------------------------
# Mozilla/Firefox Wayland Support
# ------------------------------------------------------------------------------
env=MOZ_ENABLE_WAYLAND,1

# ------------------------------------------------------------------------------
# Additional Environment Variables (Add your custom ones here)
# ------------------------------------------------------------------------------
# Example: Hardware acceleration
# env=WLR_NO_HARDWARE_CURSORS,1
# env=WLR_RENDERER,vulkan

# Example: Java applications on Wayland
# env=_JAVA_AWT_WM_NONREPARENTING,1

# Example: Electron apps on Wayland
# env=ELECTRON_OZONE_PLATFORM_HINT,wayland